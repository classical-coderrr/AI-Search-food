spring:
  datasource:
    url: jdbc:h2:mem:ai_smart_recipe;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  agent:
    state-store: memory
    recovery:
      enabled: false
  ai:
    env-file: target/test-ai-config.env
  ingredient-images:
    enabled: false
  notifications:
    scheduler:
      enabled: false
  jwt:
    secret: test-secret-test-secret-test-secret-32
    expiration-minutes: 1440
  sms:
    provider: mock
    code-expiry: 5m
    resend-interval: 60s
    max-attempts: 5

server:
  port: ${SERVER_PORT:7068}

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/ai_smart_recipe?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:recipe_app}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}

app:
  agent:
    state-store: ${AGENT_STATE_STORE:redis}
    recovery:
      enabled: ${AGENT_RECOVERY_ENABLED:true}
      scan-delay: ${AGENT_RECOVERY_SCAN_DELAY:PT30S}
      stale-after: ${AGENT_RECOVERY_STALE_AFTER:PT5M}
      lease-duration: ${AGENT_RECOVERY_LEASE_DURATION:PT10M}
  jwt:
    secret: ${JWT_SECRET:}
  sms:
    provider: ${SMS_PROVIDER:aliyun-pnvs}
    code-expiry: ${SMS_CODE_EXPIRY:5m}
    resend-interval: ${SMS_RESEND_INTERVAL:60s}
    max-attempts: ${SMS_MAX_ATTEMPTS:5}
    pnvs:
      access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
      access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
      sign-name: ${ALIYUN_PNVS_SIGN_NAME:}
      template-code: ${ALIYUN_PNVS_TEMPLATE_CODE:}
      endpoint: ${ALIYUN_PNVS_ENDPOINT:dypnsapi.aliyuncs.com}
      scheme-name: ${ALIYUN_PNVS_SCHEME_NAME:}
      connect-timeout: ${PNVS_CONNECT_TIMEOUT:5s}
      read-timeout: ${PNVS_READ_TIMEOUT:10s}
  ai:
    env-file: ${APP_AI_ENV_FILE:/app/config/.env}
    qwen:
      api-key: ${DASHSCOPE_API_KEY:}
      model: ${DASHSCOPE_MODEL:qwen-plus}
      vision-model: ${DASHSCOPE_VISION_MODEL:qwen-vl-plus}
      endpoint: ${DASHSCOPE_BASE_URL:${DASHSCOPE_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}}
  finished-dish-reviews:
    storage-dir: ${FINISHED_DISH_REVIEW_STORAGE_DIR:/app/data/finished-dish-reviews}
  user-avatars:
    storage-dir: ${USER_AVATAR_STORAGE_DIR:/app/data/user-avatars}
  feature-suggestions:
    storage-dir: ${FEATURE_SUGGESTION_STORAGE_DIR:/app/data/feature-suggestions}
  videos:
    bilibili:
      enabled: ${BILIBILI_VIDEO_SEARCH_ENABLED:true}
      base-url: ${BILIBILI_VIDEO_SEARCH_BASE_URL:https://api.bilibili.com/x/web-interface/search/type}
      cache-ttl: ${BILIBILI_VIDEO_SEARCH_CACHE_TTL:PT45M}
      cache-max-entries: ${BILIBILI_VIDEO_SEARCH_CACHE_MAX_ENTRIES:256}
      connect-timeout: ${BILIBILI_VIDEO_SEARCH_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${BILIBILI_VIDEO_SEARCH_READ_TIMEOUT:PT5S}
      max-results: ${BILIBILI_VIDEO_SEARCH_MAX_RESULTS:6}
      rate-limit-window: ${BILIBILI_VIDEO_SEARCH_RATE_LIMIT_WINDOW:PT1M}
      rate-limit-max-requests: ${BILIBILI_VIDEO_SEARCH_RATE_LIMIT_MAX_REQUESTS:12}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

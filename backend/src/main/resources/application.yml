server:
  port: 7068

spring:
  application:
    name: ai-smart-recipe-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${H2_URL:jdbc:h2:mem:ai_smart_recipe;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${H2_USERNAME:sa}
    password: ${H2_PASSWORD:}
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  agent:
    state-store: ${AGENT_STATE_STORE:redis}
    intent-recognition:
      enabled: ${AGENT_INTENT_RECOGNITION_ENABLED:true}
      confidence-threshold: ${AGENT_INTENT_RECOGNITION_CONFIDENCE_THRESHOLD:0.85}
    recovery:
      enabled: ${AGENT_RECOVERY_ENABLED:false}
      scan-delay: ${AGENT_RECOVERY_SCAN_DELAY:PT30S}
      stale-after: ${AGENT_RECOVERY_STALE_AFTER:PT5M}
      lease-duration: ${AGENT_RECOVERY_LEASE_DURATION:PT10M}
    observability:
      persistence:
        enabled: ${AGENT_METRICS_PERSISTENCE_ENABLED:true}
        snapshot-interval: ${AGENT_METRICS_SNAPSHOT_INTERVAL:PT5M}
        initial-delay: ${AGENT_METRICS_SNAPSHOT_INITIAL_DELAY:PT30S}
        retention: ${AGENT_METRICS_SNAPSHOT_RETENTION:P30D}
      alerts:
        enabled: ${AGENT_METRICS_ALERTS_ENABLED:true}
        minimum-samples: ${AGENT_METRICS_ALERT_MINIMUM_SAMPLES:5}
        failure-rate-threshold: ${AGENT_METRICS_ALERT_FAILURE_RATE:0.20}
        recovery-rate-threshold: ${AGENT_METRICS_ALERT_RECOVERY_RATE:0.20}
        duplicate-write-rate-threshold: ${AGENT_METRICS_ALERT_DUPLICATE_WRITE_RATE:0.10}
    write-drill:
      enabled: ${AGENT_WRITE_DRILL_ENABLED:false}
      pause-before-business-write: ${AGENT_WRITE_DRILL_PAUSE_BEFORE:PT0S}
      pause-after-business-write: ${AGENT_WRITE_DRILL_PAUSE_AFTER:PT0S}
  ingredient-images:
    enabled: ${INGREDIENT_IMAGES_ENABLED:true}
  finished-dish-reviews:
    storage-dir: ${FINISHED_DISH_REVIEW_STORAGE_DIR:./data/finished-dish-reviews}
  user-avatars:
    storage-dir: ${USER_AVATAR_STORAGE_DIR:./data/user-avatars}
  feature-suggestions:
    storage-dir: ${FEATURE_SUGGESTION_STORAGE_DIR:./data/feature-suggestions}
  notifications:
    scheduler:
      enabled: ${NOTIFICATION_SCHEDULER_ENABLED:true}
      fixed-delay: ${NOTIFICATION_SCHEDULER_FIXED_DELAY:PT1H}
      initial-delay: ${NOTIFICATION_SCHEDULER_INITIAL_DELAY:PT30S}
  videos:
    bilibili:
      # Experimental web search dependency; it may change or be rate limited by Bilibili.
      enabled: ${BILIBILI_VIDEO_SEARCH_ENABLED:true}
      base-url: ${BILIBILI_VIDEO_SEARCH_BASE_URL:https://api.bilibili.com/x/web-interface/search/type}
      cache-ttl: ${BILIBILI_VIDEO_SEARCH_CACHE_TTL:PT45M}
      cache-max-entries: ${BILIBILI_VIDEO_SEARCH_CACHE_MAX_ENTRIES:256}
      connect-timeout: ${BILIBILI_VIDEO_SEARCH_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${BILIBILI_VIDEO_SEARCH_READ_TIMEOUT:PT5S}
      max-results: ${BILIBILI_VIDEO_SEARCH_MAX_RESULTS:6}
      rate-limit-window: ${BILIBILI_VIDEO_SEARCH_RATE_LIMIT_WINDOW:PT1M}
      rate-limit-max-requests: ${BILIBILI_VIDEO_SEARCH_RATE_LIMIT_MAX_REQUESTS:12}
  jwt:
    secret: ${JWT_SECRET:change-this-secret-change-this-secret-32}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  sms:
    provider: ${SMS_PROVIDER:mock}
    code-expiry: ${SMS_CODE_EXPIRY:5m}
    resend-interval: ${SMS_RESEND_INTERVAL:60s}
    max-attempts: ${SMS_MAX_ATTEMPTS:5}
    aliyun:
      access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
      access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
      sign-name: ${ALIYUN_SMS_SIGN_NAME:}
      template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
      endpoint: ${ALIYUN_SMS_ENDPOINT:dysmsapi.aliyuncs.com}
    pnvs:
      access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
      access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
      sign-name: ${ALIYUN_PNVS_SIGN_NAME:}
      template-code: ${ALIYUN_PNVS_TEMPLATE_CODE:}
      endpoint: ${ALIYUN_PNVS_ENDPOINT:dypnsapi.aliyuncs.com}
      scheme-name: ${ALIYUN_PNVS_SCHEME_NAME:}
      connect-timeout: ${PNVS_CONNECT_TIMEOUT:5s}
      read-timeout: ${PNVS_READ_TIMEOUT:10s}
  ai:
    env-file: ${APP_AI_ENV_FILE:../.env}
    qwen:
      api-key: ${DASHSCOPE_API_KEY:}
      model: ${DASHSCOPE_MODEL:qwen-plus}
      vision-model: ${DASHSCOPE_VISION_MODEL:qwen-vl-plus}
      endpoint: ${DASHSCOPE_BASE_URL:${DASHSCOPE_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

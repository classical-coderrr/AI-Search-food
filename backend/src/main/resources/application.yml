server:
  port: 7068

spring:
  application:
    name: ai-smart-recipe-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${H2_URL:jdbc:h2:mem:ai_smart_recipe;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${H2_USERNAME:sa}
    password: ${H2_PASSWORD:}
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  memory:
    mcp:
      enabled: ${MEMORY_MCP_ENABLED:false}
    session:
      cleanup-interval: ${MEMORY_SESSION_CLEANUP_INTERVAL:PT5M}
      cleanup-batch-size: ${MEMORY_SESSION_CLEANUP_BATCH_SIZE:200}
    embedding:
      enabled: ${MEMORY_VECTOR_ENABLED:true}
      model: ${MEMORY_EMBEDDING_MODEL:text-embedding-v3}
      dimensions: ${MEMORY_EMBEDDING_DIMENSIONS:1024}
      batch-size: ${MEMORY_EMBEDDING_BATCH_SIZE:8}
      recall-limit: ${MEMORY_VECTOR_RECALL_LIMIT:200}
      scan-limit: ${MEMORY_VECTOR_SCAN_LIMIT:5000}
      poll-batch-size: ${MEMORY_EMBEDDING_POLL_BATCH_SIZE:24}
      poll-interval: ${MEMORY_EMBEDDING_POLL_INTERVAL:PT30S}
      index-user-id: ${MEMORY_EMBEDDING_INDEX_USER_ID:0}
      retry-base-delay: ${MEMORY_EMBEDDING_RETRY_BASE_DELAY:PT5S}
      retry-max-delay: ${MEMORY_EMBEDDING_RETRY_MAX_DELAY:PT30M}
      lease-duration: ${MEMORY_EMBEDDING_LEASE_DURATION:PT2M}
    vector:
      qdrant:
        enabled: ${MEMORY_QDRANT_ENABLED:false}
        url: ${MEMORY_QDRANT_URL:http://localhost:6333}
        api-key: ${MEMORY_QDRANT_API_KEY:}
        collection: ${MEMORY_QDRANT_COLLECTION:xiaochuling_memory_v1}
        connect-timeout: ${MEMORY_QDRANT_CONNECT_TIMEOUT:PT2S}
        read-timeout: ${MEMORY_QDRANT_READ_TIMEOUT:PT4S}
        poll-interval: ${MEMORY_QDRANT_POLL_INTERVAL:PT5S}
        poll-batch-size: ${MEMORY_QDRANT_POLL_BATCH_SIZE:100}
        consistency-check-interval: ${MEMORY_QDRANT_CONSISTENCY_CHECK_INTERVAL:PT5M}
        identity-audit-interval: ${MEMORY_QDRANT_IDENTITY_AUDIT_INTERVAL:PT5S}
        identity-audit-batch-size: ${MEMORY_QDRANT_IDENTITY_AUDIT_BATCH_SIZE:500}
    ranking:
      semantic-weight: ${MEMORY_RANKING_SEMANTIC_WEIGHT:0.35}
      recency-weight: ${MEMORY_RANKING_RECENCY_WEIGHT:0.20}
      importance-weight: ${MEMORY_RANKING_IMPORTANCE_WEIGHT:0.15}
      confidence-weight: ${MEMORY_RANKING_CONFIDENCE_WEIGHT:0.15}
      feedback-weight: ${MEMORY_RANKING_FEEDBACK_WEIGHT:0.10}
      explicit-user-feedback-weight: ${MEMORY_RANKING_USER_FEEDBACK_WEIGHT:0.20}
      user-feedback-max-age-days: ${MEMORY_RANKING_USER_FEEDBACK_MAX_AGE_DAYS:180}
      context-weight: ${MEMORY_RANKING_CONTEXT_WEIGHT:0.05}
      vector-semantic-ratio: ${MEMORY_RANKING_VECTOR_SEMANTIC_RATIO:0.70}
      explicit-preference-half-life-days: ${MEMORY_EXPLICIT_HALF_LIFE_DAYS:3650}
      implicit-preference-half-life-days: ${MEMORY_IMPLICIT_HALF_LIFE_DAYS:180}
      short-term-trend-half-life-days: ${MEMORY_SHORT_TERM_HALF_LIFE_DAYS:30}
      behavior-pattern-half-life-days: ${MEMORY_BEHAVIOR_HALF_LIFE_DAYS:365}
      temporary-context-half-life-days: ${MEMORY_TEMPORARY_HALF_LIFE_DAYS:7}
      candidate-limit: ${MEMORY_RETRIEVAL_CANDIDATE_LIMIT:200}
      default-token-budget: ${MEMORY_CONTEXT_TOKEN_BUDGET:1800}
    observability:
      trace-retention: ${MEMORY_TRACE_RETENTION:P30D}
      trace-cleanup-interval: ${MEMORY_TRACE_CLEANUP_INTERVAL:PT6H}
    processing:
      poll-interval: ${MEMORY_PROCESSING_POLL_INTERVAL:PT2S}
      batch-size: ${MEMORY_PROCESSING_BATCH_SIZE:10}
      lease-duration: ${MEMORY_PROCESSING_LEASE_DURATION:PT2M}
      retry-base-delay: ${MEMORY_PROCESSING_RETRY_BASE_DELAY:PT5S}
      retry-max-delay: ${MEMORY_PROCESSING_RETRY_MAX_DELAY:PT30M}
      max-attempts: ${MEMORY_PROCESSING_MAX_ATTEMPTS:8}
    prompts:
      agent-context-version: ${MEMORY_AGENT_CONTEXT_PROMPT_VERSION:memory-agent-context-v1}
    evaluation:
      minimum-online-label-count: ${MEMORY_ONLINE_EVALUATION_MINIMUM_LABEL_COUNT:20}
  agent:
    state-store: ${AGENT_STATE_STORE:redis}
    intent-recognition:
      enabled: ${AGENT_INTENT_RECOGNITION_ENABLED:true}
      confidence-threshold: ${AGENT_INTENT_RECOGNITION_CONFIDENCE_THRESHOLD:0.85}
    recovery:
      enabled: ${AGENT_RECOVERY_ENABLED:false}
      scan-delay: ${AGENT_RECOVERY_SCAN_DELAY:PT30S}
      stale-after: ${AGENT_RECOVERY_STALE_AFTER:PT5M}
      lease-duration: ${AGENT_RECOVERY_LEASE_DURATION:PT10M}
    observability:
      persistence:
        enabled: ${AGENT_METRICS_PERSISTENCE_ENABLED:true}
        snapshot-interval: ${AGENT_METRICS_SNAPSHOT_INTERVAL:PT5M}
        initial-delay: ${AGENT_METRICS_SNAPSHOT_INITIAL_DELAY:PT30S}
        retention: ${AGENT_METRICS_SNAPSHOT_RETENTION:P30D}
      alerts:
        enabled: ${AGENT_METRICS_ALERTS_ENABLED:true}
        minimum-samples: ${AGENT_METRICS_ALERT_MINIMUM_SAMPLES:5}
        failure-rate-threshold: ${AGENT_METRICS_ALERT_FAILURE_RATE:0.20}
        recovery-rate-threshold: ${AGENT_METRICS_ALERT_RECOVERY_RATE:0.20}
        duplicate-write-rate-threshold: ${AGENT_METRICS_ALERT_DUPLICATE_WRITE_RATE:0.10}
    evaluation:
      enabled: ${AGENT_EVALUATION_ENABLED:true}
      interval: ${AGENT_EVALUATION_INTERVAL:P1D}
      initial-delay: ${AGENT_EVALUATION_INITIAL_DELAY:PT2M}
    write-drill:
      enabled: ${AGENT_WRITE_DRILL_ENABLED:false}
      pause-before-business-write: ${AGENT_WRITE_DRILL_PAUSE_BEFORE:PT0S}
      pause-after-business-write: ${AGENT_WRITE_DRILL_PAUSE_AFTER:PT0S}
  ingredient-images:
    enabled: ${INGREDIENT_IMAGES_ENABLED:true}
  finished-dish-reviews:
    storage-dir: ${FINISHED_DISH_REVIEW_STORAGE_DIR:./data/finished-dish-reviews}
  user-avatars:
    storage-dir: ${USER_AVATAR_STORAGE_DIR:./data/user-avatars}
  feature-suggestions:
    storage-dir: ${FEATURE_SUGGESTION_STORAGE_DIR:./data/feature-suggestions}
  notifications:
    scheduler:
      enabled: ${NOTIFICATION_SCHEDULER_ENABLED:true}
      fixed-delay: ${NOTIFICATION_SCHEDULER_FIXED_DELAY:PT1H}
      initial-delay: ${NOTIFICATION_SCHEDULER_INITIAL_DELAY:PT30S}
  videos:
    bilibili:
      # Experimental web search dependency; it may change or be rate limited by Bilibili.
      enabled: ${BILIBILI_VIDEO_SEARCH_ENABLED:true}
      base-url: ${BILIBILI_VIDEO_SEARCH_BASE_URL:https://api.bilibili.com/x/web-interface/search/type}
      cache-ttl: ${BILIBILI_VIDEO_SEARCH_CACHE_TTL:PT45M}
      cache-max-entries: ${BILIBILI_VIDEO_SEARCH_CACHE_MAX_ENTRIES:256}
      connect-timeout: ${BILIBILI_VIDEO_SEARCH_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${BILIBILI_VIDEO_SEARCH_READ_TIMEOUT:PT5S}
      max-results: ${BILIBILI_VIDEO_SEARCH_MAX_RESULTS:6}
      rate-limit-window: ${BILIBILI_VIDEO_SEARCH_RATE_LIMIT_WINDOW:PT1M}
      rate-limit-max-requests: ${BILIBILI_VIDEO_SEARCH_RATE_LIMIT_MAX_REQUESTS:12}
  jwt:
    secret: ${JWT_SECRET:change-this-secret-change-this-secret-32}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  sms:
    provider: ${SMS_PROVIDER:mock}
    code-expiry: ${SMS_CODE_EXPIRY:5m}
    resend-interval: ${SMS_RESEND_INTERVAL:60s}
    max-attempts: ${SMS_MAX_ATTEMPTS:5}
    aliyun:
      access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
      access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
      sign-name: ${ALIYUN_SMS_SIGN_NAME:}
      template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
      endpoint: ${ALIYUN_SMS_ENDPOINT:dysmsapi.aliyuncs.com}
    pnvs:
      access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
      access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
      sign-name: ${ALIYUN_PNVS_SIGN_NAME:}
      template-code: ${ALIYUN_PNVS_TEMPLATE_CODE:}
      endpoint: ${ALIYUN_PNVS_ENDPOINT:dypnsapi.aliyuncs.com}
      scheme-name: ${ALIYUN_PNVS_SCHEME_NAME:}
      connect-timeout: ${PNVS_CONNECT_TIMEOUT:5s}
      read-timeout: ${PNVS_READ_TIMEOUT:10s}
  ai:
    env-file: ${APP_AI_ENV_FILE:../.env}
    qwen:
      api-key: ${DASHSCOPE_API_KEY:}
      model: ${DASHSCOPE_MODEL:qwen-plus}
      vision-model: ${DASHSCOPE_VISION_MODEL:qwen-vl-plus}
      endpoint: ${DASHSCOPE_BASE_URL:${DASHSCOPE_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}}
      planning-enabled: ${AI_RECIPE_PLANNING_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

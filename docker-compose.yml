name: ai-search-food

services:
  mysql:
    image: mysql:8.4.3
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - database_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server --appendonly yes; fi"]
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: mysql,prod,docker
      SERVER_PORT: 7068
      MYSQL_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?set MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      MYSQL_USERNAME: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-2s}
      AGENT_STATE_STORE: redis
      AGENT_RECOVERY_ENABLED: ${AGENT_RECOVERY_ENABLED:-true}
      AGENT_RECOVERY_SCAN_DELAY: ${AGENT_RECOVERY_SCAN_DELAY:-PT30S}
      AGENT_RECOVERY_STALE_AFTER: ${AGENT_RECOVERY_STALE_AFTER:-PT5M}
      AGENT_RECOVERY_LEASE_DURATION: ${AGENT_RECOVERY_LEASE_DURATION:-PT10M}
      AGENT_WRITE_DRILL_ENABLED: ${AGENT_WRITE_DRILL_ENABLED:-false}
      AGENT_WRITE_DRILL_PAUSE_BEFORE: ${AGENT_WRITE_DRILL_PAUSE_BEFORE:-PT0S}
      AGENT_WRITE_DRILL_PAUSE_AFTER: ${AGENT_WRITE_DRILL_PAUSE_AFTER:-PT0S}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET_at_least_32_bytes}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
      DASHSCOPE_VISION_MODEL: ${DASHSCOPE_VISION_MODEL:-qwen-vl-plus}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      APP_AI_ENV_FILE: /app/config/.env
      SMS_PROVIDER: aliyun-pnvs
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID:?set ALIBABA_CLOUD_ACCESS_KEY_ID}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:?set ALIBABA_CLOUD_ACCESS_KEY_SECRET}
      ALIYUN_PNVS_SIGN_NAME: ${ALIYUN_PNVS_SIGN_NAME:?set ALIYUN_PNVS_SIGN_NAME}
      ALIYUN_PNVS_TEMPLATE_CODE: ${ALIYUN_PNVS_TEMPLATE_CODE:?set ALIYUN_PNVS_TEMPLATE_CODE}
      ALIYUN_PNVS_ENDPOINT: ${ALIYUN_PNVS_ENDPOINT:-dypnsapi.aliyuncs.com}
      ALIYUN_PNVS_SCHEME_NAME: ${ALIYUN_PNVS_SCHEME_NAME:-}
      SMS_CODE_EXPIRY: ${SMS_CODE_EXPIRY:-5m}
      SMS_RESEND_INTERVAL: ${SMS_RESEND_INTERVAL:-60s}
      SMS_MAX_ATTEMPTS: ${SMS_MAX_ATTEMPTS:-5}
      PNVS_CONNECT_TIMEOUT: ${PNVS_CONNECT_TIMEOUT:-5s}
      PNVS_READ_TIMEOUT: ${PNVS_READ_TIMEOUT:-10s}
      FINISHED_DISH_REVIEW_STORAGE_DIR: /app/data/finished-dish-reviews
      USER_AVATAR_STORAGE_DIR: /app/data/user-avatars
      BILIBILI_VIDEO_SEARCH_ENABLED: ${BILIBILI_VIDEO_SEARCH_ENABLED:-true}
      BILIBILI_VIDEO_SEARCH_BASE_URL: ${BILIBILI_VIDEO_SEARCH_BASE_URL:-https://api.bilibili.com/x/web-interface/search/type}
      BILIBILI_VIDEO_SEARCH_CACHE_TTL: ${BILIBILI_VIDEO_SEARCH_CACHE_TTL:-PT45M}
      BILIBILI_VIDEO_SEARCH_CACHE_MAX_ENTRIES: ${BILIBILI_VIDEO_SEARCH_CACHE_MAX_ENTRIES:-256}
      BILIBILI_VIDEO_SEARCH_CONNECT_TIMEOUT: ${BILIBILI_VIDEO_SEARCH_CONNECT_TIMEOUT:-PT3S}
      BILIBILI_VIDEO_SEARCH_READ_TIMEOUT: ${BILIBILI_VIDEO_SEARCH_READ_TIMEOUT:-PT5S}
      BILIBILI_VIDEO_SEARCH_MAX_RESULTS: ${BILIBILI_VIDEO_SEARCH_MAX_RESULTS:-6}
      BILIBILI_VIDEO_SEARCH_RATE_LIMIT_WINDOW: ${BILIBILI_VIDEO_SEARCH_RATE_LIMIT_WINDOW:-PT1M}
      BILIBILI_VIDEO_SEARCH_RATE_LIMIT_MAX_REQUESTS: ${BILIBILI_VIDEO_SEARCH_RATE_LIMIT_MAX_REQUESTS:-12}
    volumes:
      - review_uploads:/app/data/finished-dish-reviews
      - user_avatars:/app/data/user-avatars
      - ./.env:/app/config/.env
    networks:
      - app_network
      - database_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:7068/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    networks:
      - app_network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=- http://127.0.0.1:8080/healthz | grep -q '^ok$' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
  redis_data:
  review_uploads:
  user_avatars:

networks:
  app_network:
  database_network:
    internal: true
